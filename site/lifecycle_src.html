<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>agentic-uart-demo — lifecycle</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#eef1f0; --panel:#ffffff; --ink:#1e2423; --ink-2:#5c6663; --line:#d3dad7;
  --rx:#0f766e; --tx:#6d5bd0; --chip:#f2f5f4; --good:#19715c; --goodbg:#e7f2ee;
  --human:#b45309; --bad:#b0433d;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161a19; --panel:#1e2423; --ink:#e8ecea; --ink-2:#96a19d; --line:#323b38;
  --rx:#34c3b5; --tx:#a795f5; --chip:#242b29; --good:#5fd4b4; --goodbg:#1d322b;
  --human:#e0a050; --bad:#e07a74;
}}
:root[data-theme=light]{--bg:#eef1f0;--panel:#fff;--ink:#1e2423;--ink-2:#5c6663;--line:#d3dad7;--rx:#0f766e;--tx:#6d5bd0;--chip:#f2f5f4;--good:#19715c;--goodbg:#e7f2ee;--human:#b45309;--bad:#b0433d}
:root[data-theme=dark]{--bg:#161a19;--panel:#1e2423;--ink:#e8ecea;--ink-2:#96a19d;--line:#323b38;--rx:#34c3b5;--tx:#a795f5;--chip:#242b29;--good:#5fd4b4;--goodbg:#1d322b;--human:#e0a050;--bad:#e07a74}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.wrap{max-width:1500px;margin:0 auto;padding:0 1.2rem 3rem}
/* ---- tab bar ---- */
.tabs{display:flex;flex-wrap:wrap;gap:.4rem;padding:1.1rem 0 .2rem}
.tab{border:1.5px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink-2);
  padding:.32rem .85rem;font:600 .68rem ui-monospace,monospace;letter-spacing:.08em;
  text-transform:uppercase;text-decoration:none;white-space:nowrap}
.tab:hover{border-color:var(--rx);color:var(--rx)}
.tab.on{background:var(--rx);border-color:var(--rx);color:#fff}
.eyebrow{font:600 .74rem ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;
  color:var(--rx);display:block;margin:1.5rem 0 .35rem}
h1{font-size:clamp(1.4rem,3.2vw,2rem);line-height:1.15;margin:.1rem 0 .4rem}
.sub{color:var(--ink-2);max-width:82ch;margin:0 0 1.2rem;font-size:.95rem}
.app{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:1rem;align-items:start}
.stage{position:relative;display:grid;grid-template-columns:430px minmax(0,1fr);gap:1.1rem;
  padding-bottom:.6rem}
#fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:visible}
.panelbox{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;
  padding:.85rem .8rem .9rem;min-width:0;position:relative;align-self:start}
#wires{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:visible}
.tierc,.sessions,.tree{position:relative;z-index:1}
.ptitle{font:700 .7rem ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);margin:0 0 .55rem}
/* ---- org tree ---- */
.tierc{display:flex;justify-content:center}
.agnode{position:relative;border:1.7px solid var(--line);border-radius:9px;background:var(--panel);
  padding:.36rem .55rem .4rem;text-align:center;cursor:pointer;min-width:0;font-family:inherit;
  color:inherit;transition:opacity .25s,border-color .25s,background .25s}
.agnode .nm{font:600 .78rem system-ui,sans-serif;display:block;white-space:nowrap}
.agnode .rl{font:500 .6rem ui-monospace,monospace;color:var(--ink-2);letter-spacing:.04em;
  display:block;margin-top:.05rem;white-space:nowrap}
.agnode.human{border-color:var(--human)}.agnode.human .nm{color:var(--human)}
.agnode.ghost{border-style:dashed;opacity:.42;background:transparent}
.agnode.ghost .nm{color:var(--ink-2);font-weight:500}
.agnode.live{border-color:var(--rx);opacity:1;background:color-mix(in srgb,var(--rx) 10%,var(--panel))}
.agnode.live.aud{border-color:var(--tx);background:color-mix(in srgb,var(--tx) 10%,var(--panel))}
.agnode.blind.live{border-color:var(--tx);background:color-mix(in srgb,var(--tx) 12%,var(--panel))}
.link{height:1.5rem}
.sessions{border:1.6px dashed var(--line);border-radius:13px;padding:.7rem .65rem .75rem;
  position:relative;margin-top:.1rem}
.sessions .slab{position:absolute;top:-.6rem;left:.85rem;background:var(--bg);padding:0 .4rem;
  font:600 .6rem ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);cursor:pointer;border:0}
.orchrow{position:relative;display:flex;justify-content:center;margin-top:.2rem}
#ag-orch{width:196px}
#ag-audit{position:absolute;right:0;top:50%;transform:translateY(-50%)}
#ag-audit .rl{display:none}
.leadrow3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:2.3rem}
.col{display:flex;flex-direction:column}
.kids{display:flex;flex-direction:column;gap:.4rem;margin-top:1.5rem}
.agnode.lead .nm{font-size:.7rem}
.agnode.lead{padding:.34rem .2rem .36rem}
.agnode.wk{padding:.24rem .3rem .26rem}
.agnode.wk .nm{font:500 .58rem ui-monospace,monospace}
/* ---- repository ---- */
.repo{position:relative;border:2px solid var(--rx);border-radius:16px;
  background:color-mix(in srgb,var(--rx) 3%,var(--panel));padding:1rem .8rem .85rem}
.repo>.rlab{position:absolute;top:-.72rem;left:1rem;background:var(--bg);padding:0 .5rem;
  font:700 .66rem ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;
  color:var(--rx);cursor:pointer;border:0}
.rgate,.rci{position:absolute;left:-13px;width:26px;height:52px;border-radius:7px;
  background:var(--panel);cursor:pointer;z-index:5;display:flex;align-items:center;
  justify-content:center;font:700 .58rem ui-monospace,monospace;writing-mode:vertical-rl;
  letter-spacing:.14em;transition:background .2s,border-color .2s}
.rgate{top:38%;border:2px solid var(--rx);color:var(--rx)}
.rci{top:calc(38% + 62px);border:2px solid var(--tx);color:var(--tx)}
.rgate.hot{background:var(--goodbg)}
.rgate.deny{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--panel))}
.rci.hot{background:color-mix(in srgb,var(--tx) 18%,var(--panel))}
.sweep{position:absolute;top:0;bottom:0;width:56px;pointer-events:none;border-radius:16px;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--tx) 18%,transparent),transparent);
  opacity:0;z-index:3}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:.55rem}
.rempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font:600 .72rem ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);opacity:.55;pointer-events:none}
.rgroup{border:1.3px solid var(--line);border-radius:10px;padding:.74rem .5rem .48rem;
  position:relative;background:var(--panel);transition:opacity .3s}
.rgroup>.glab{position:absolute;top:-.54rem;left:.5rem;background:var(--panel);padding:0 .32rem;
  font:600 .56rem ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);border:0;cursor:pointer;border-radius:4px}
.rgroup>.glab:hover{color:var(--rx)}
.rgroup.human{border-color:color-mix(in srgb,var(--human) 55%,var(--line))}
.rgroup.human>.glab{color:var(--human)}
.rboxes{display:flex;flex-wrap:wrap;gap:.36rem;align-items:flex-start}
.rbox{border:1.4px solid var(--line);border-radius:7px;background:var(--chip);
  padding:.2rem .46rem .22rem;font:600 .71rem system-ui,sans-serif;cursor:pointer;position:relative;
  color:inherit;transition:opacity .3s,border-color .2s,background .2s}
.rbox.hu{border-color:color-mix(in srgb,var(--human) 50%,var(--line));
  background:color-mix(in srgb,var(--human) 9%,var(--panel))}
.rbox:hover,.agnode:not(.unborn):hover,.chip:hover{border-color:var(--rx)}
.rbox.big{flex:1 1 100%;text-align:center;padding:.3rem .5rem}
.rbox .st{position:absolute;top:-.78rem;right:-.35rem;font:700 .5rem ui-monospace,monospace;
  letter-spacing:.05em;border-radius:5px;padding:.03rem .28rem;background:var(--goodbg);
  color:var(--good);border:1px solid var(--good);transition:opacity .25s}
.rbox .st.warn{background:color-mix(in srgb,var(--bad) 15%,var(--panel));color:var(--bad);border-color:var(--bad)}
.rbox .st.gold{background:color-mix(in srgb,var(--human) 16%,var(--panel));color:var(--human);border-color:var(--human)}
.seatbox{border:1.4px solid var(--line);border-radius:8px;padding:.4rem .38rem .36rem;
  position:relative;flex:1 1 30%;min-width:118px;transition:opacity .3s}
.seatbox>.sn{font:600 .66rem system-ui,sans-serif;display:block;margin:0 0 .26rem .06rem;
  border:0;background:none;padding:0;cursor:pointer;color:inherit;text-align:left}
.seatbox>.sn:hover{color:var(--rx)}
.chips{display:flex;gap:.26rem;flex-wrap:wrap}
.chip{border:1.2px solid var(--line);border-radius:5px;padding:.06rem .34rem;
  font:500 .58rem ui-monospace,monospace;color:var(--ink-2);background:var(--panel);cursor:pointer;
  transition:all .2s}
.chip.glow{border-color:var(--rx);color:var(--rx);background:color-mix(in srgb,var(--rx) 15%,var(--panel))}
.chip b,.rbox b.cnt{color:var(--rx);font-weight:700}
.unborn{opacity:0!important;pointer-events:none!important}
.rbox.unborn,.seatbox.unborn,.rgroup.unborn{display:none!important}
.flashy{border-color:var(--rx)!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--rx) 42%,transparent)}
/* ---- rail ---- */
.rail{display:flex;flex-direction:column;gap:.85rem;position:sticky;top:.8rem}
.anno{border:1.6px solid var(--rx);border-radius:12px;background:var(--panel);padding:.7rem .8rem .78rem}
.anno .ph{font:700 .58rem ui-monospace,monospace;letter-spacing:.12em;color:var(--rx);text-transform:uppercase}
.anno .ct{font:500 .58rem ui-monospace,monospace;color:var(--ink-2);float:right}
.anno .bt{font:700 .95rem system-ui,sans-serif;margin:.18rem 0 .28rem;line-height:1.3}
.anno .tx{color:var(--ink-2);font-size:.83rem;line-height:1.55}
.anno .sha{font:500 .6rem ui-monospace,monospace;color:var(--ink-2);margin-top:.4rem;
  border-top:1px solid var(--line);padding-top:.35rem;display:block}
.anno .sha a{color:var(--rx);text-decoration:none}
.detail{border:1.4px solid var(--line);border-radius:12px;background:var(--panel);padding:.7rem .8rem .78rem}
.detail .dt{font:700 .86rem system-ui,sans-serif;margin:0 0 .26rem}
.detail .hint{font:500 .6rem ui-monospace,monospace;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase}
.jbox{margin-top:.6rem;border-top:1px solid var(--line);padding-top:.5rem;
  max-height:min(48vh,560px);overflow-y:auto}
.jhead{font:600 .58rem ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase;
  color:var(--rx);margin-bottom:.35rem}
.lent{padding:.32rem 0;border-bottom:1px dotted var(--line)}
.lent:last-child{border-bottom:0}
.lhead{display:flex;gap:.4rem;align-items:baseline;flex-wrap:wrap}
.ln{font:700 .68rem ui-monospace,monospace;color:var(--rx);overflow-wrap:break-word}
.lde{font-size:.76rem;line-height:1.5;color:var(--ink-2);margin-top:.1rem;overflow-wrap:break-word}
.jempty{font-size:.76rem;color:var(--ink-2);font-style:italic}
.pill{font:700 .55rem ui-monospace,monospace;letter-spacing:.07em;padding:.02rem .3rem;
  border-radius:4px;border:1px solid var(--good);color:var(--good);background:var(--goodbg);white-space:nowrap}
.pill.bad{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.pill.wait{border-color:var(--tx);color:var(--tx);background:color-mix(in srgb,var(--tx) 12%,var(--panel))}
.pill.gold{border-color:var(--human);color:var(--human);background:color-mix(in srgb,var(--human) 14%,var(--panel))}
pre.src{background:var(--chip);border-radius:7px;padding:.5rem .55rem;overflow-x:auto;
  font:500 .66rem/1.5 ui-monospace,monospace;max-height:min(46vh,520px);margin:.4rem 0 0;white-space:pre}
/* ---- transport ---- */
.transport{margin-top:1rem;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);
  padding:.65rem .85rem .5rem}
.trow{display:flex;align-items:center;gap:.6rem}
.tbtn{border:1.6px solid var(--rx);color:var(--rx);background:var(--panel);border-radius:8px;
  font:700 .78rem ui-monospace,monospace;padding:.28rem .65rem;cursor:pointer;min-width:3.3rem}
.tbtn:hover{background:color-mix(in srgb,var(--rx) 10%,var(--panel))}
.tbtn:focus-visible,.rbox:focus-visible,.agnode:focus-visible,.chip:focus-visible{outline:2px solid var(--rx);outline-offset:2px}
#scrub{flex:1;accent-color:var(--rx);height:1.2rem;cursor:pointer;min-width:0}
.phlabels{position:relative;height:2.05rem;margin:.15rem 3.75rem 0 8.6rem}
.phlabels span{position:absolute;top:0;font:600 .56rem ui-monospace,monospace;letter-spacing:.07em;
  color:var(--ink-2);text-transform:uppercase;cursor:pointer;border-left:1px solid var(--line);
  padding-left:.26rem;white-space:nowrap}
.phlabels span:hover{color:var(--rx)}
.legend{display:flex;flex-wrap:wrap;gap:.85rem;margin-top:.5rem;font:500 .62rem ui-monospace,monospace;
  color:var(--ink-2);align-items:center}
.lg{display:flex;align-items:center;gap:.3rem}
.lg i{display:inline-block}
.lg .tk{width:10px;height:10px;border-radius:3px;background:var(--rx)}
.lg .tr{width:10px;height:10px;border-radius:50%;border:1.7px dashed var(--rx)}
.lg .tb{width:10px;height:10px;border-radius:3px;background:var(--bad)}
.lg .ta{width:10px;height:10px;border-radius:3px;background:var(--tx)}
.lg .tg{width:10px;height:10px;border-radius:3px;background:var(--human)}
.foot{border-top:1px solid var(--line);margin-top:1.8rem;padding-top:.75rem;color:var(--ink-2);
  font-size:.79rem;max-width:104ch}
@media(max-width:1180px){.app{grid-template-columns:1fr}.rail{position:static;flex-direction:row}.rail>*{flex:1}}
@media(max-width:900px){.stage{grid-template-columns:1fr}.rail{flex-direction:column}}
@media(prefers-reduced-motion:reduce){.agnode,.rbox,.rgroup,.chip,.seatbox,.rgate,.rci{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs">
    <a class="tab" href="index.html">OVERVIEW</a>
    <a class="tab on" href="lifecycle.html">LIFECYCLE</a>
    <a class="tab" href="https://github.com/renatom11/agentic-uart-demo">GITHUB &#8599;</a>
  </nav>

  <span class="eyebrow">agentic-uart-demo / lifecycle</span>
  <h1>One project, start to finish &#8212; and every step of it really happened</h1>
  <p class="sub" id="sub"></p>

  <div class="app">
    <div>
      <div class="stage" id="stage">
        <svg id="fx"></svg>

        <div class="panelbox">
          <p class="ptitle">The agents</p>
          <svg id="wires"></svg>
          <div class="tierc">
            <button class="agnode human" id="ag-sponsor" data-i="sponsor">
              <span class="nm">Sponsor</span><span class="rl">the one human</span></button>
          </div>
          <div class="link"></div>
          <div class="sessions" id="sessions">
            <button class="slab" data-i="sessions">agent sessions</button>
            <div class="orchrow">
              <button class="agnode ghost" id="ag-orch" data-i="orchestrator">
                <span class="nm">Orchestrator</span><span class="rl">spawns &#183; relays &#183; commits</span></button>
              <button class="agnode ghost aud" id="ag-auditor" data-i="auditor">
                <span class="nm">Auditor</span><span class="rl">independent</span></button>
            </div>
            <div class="leadrow3">
              <div class="col">
                <button class="agnode ghost lead" id="ag-architect_docs_lead" data-i="architect_docs_lead">
                  <span class="nm">Specification</span><span class="rl">lead</span></button>
                <div class="kids"></div>
              </div>
              <div class="col">
                <button class="agnode ghost lead" id="ag-rtl_lead" data-i="rtl_lead">
                  <span class="nm">Implementation</span><span class="rl">lead</span></button>
                <div class="kids">
                  <button class="agnode ghost wk" id="ag-rtl_module_dev" data-i="rtl_module_dev">
                    <span class="nm">worker</span></button>
                </div>
              </div>
              <div class="col">
                <button class="agnode ghost lead" id="ag-dv_lead" data-i="dv_lead">
                  <span class="nm">Verification</span><span class="rl">lead</span></button>
                <div class="kids">
                  <button class="agnode ghost wk blind" id="ag-tb_writer" data-i="tb_writer">
                    <span class="nm">bench worker</span></button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="repo" id="repo">
          <button class="rlab" data-i="repo">The repository</button>
          <button class="rgate" id="rp-gate" data-i="gate">GATE</button>
          <button class="rci" id="rp-ci" data-i="ci">CI</button>

          <div class="rgrid" id="rgrid"></div>
        </div>
      </div>

      <div class="transport">
        <div class="trow">
          <button class="tbtn" id="play" aria-label="play or pause">&#9654; PLAY</button>
          <button class="tbtn" id="spd" aria-label="playback speed">1&#215;</button>
          <input type="range" id="scrub" min="0" max="100" step="0.05" value="0" aria-label="project timeline">
          <span class="mono" style="font-size:.66rem;color:var(--ink-2);min-width:2.6rem" id="clock"></span>
        </div>
        <div class="phlabels" id="phlabels"></div>
        <div class="legend">
          <span class="lg"><i class="tk"></i> write (work + journal)</span>
          <span class="lg"><i class="tr"></i> read</span>
          <span class="lg"><i class="tb"></i> refused / defect</span>
          <span class="lg"><i class="ta"></i> blind return</span>

    <div class="rail">
      <div class="anno">

        <span class="hint" id="dhint">click any seat, group, box or file</span>

        <div id="detx"></div>
      </div>

  </div>

  <div class="foot" id="foot"></div>

<script>
/* ============================================================================
   Every visual state is a pure function of one master time T, so scrubbing
   backwards is exact: history un-happens rather than being replayed.
   The twelve beats are the twelve real commits; the files that appear are the
   files those commits actually added; the seat that lights up is the seat named
   in the commit's own trailer. All of it is read out of the repository at build
   time by site/build.py.
============================================================================ */
const D = /*__DATA__*/{};
const $ = i => document.getElementById(i);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const SEATS = ['orchestrator','architect_docs_lead','rtl_lead','dv_lead','tb_writer',
               'auditor','rtl_module_dev'];
const SEATLABEL = {orchestrator:'Orchestrator', architect_docs_lead:'Specification lead',
  rtl_lead:'Implementation lead', dv_lead:'Verification lead', tb_writer:'Bench worker (blind)',
  auditor:'Auditor', rtl_module_dev:'Implementation worker'};

const BEAT_D = 6;                              // seconds per commit
const TOTAL = D.steps.length * BEAT_D;
const BEATS = D.steps.map((s,i) => ({...s, t: i*BEAT_D, d: BEAT_D}));
const LOAD_AT = 0;

/* file births, group membership */
const BORN = {};
BEATS.forEach(b => b.added.forEach(a => { if (BORN[a.p] === undefined) BORN[a.p] = {t: b.t + b.d*0.55, g: a.g}; }));
const INGROUP = {};
for (const p in BORN) (INGROUP[BORN[p].g] ??= []).push(p);
for (const g in INGROUP) INGROUP[g].sort((a,b) => BORN[a].t - BORN[b].t || a.localeCompare(b));

/* one box per group; the boxes are the artifacts, the files live inside them */
$('rgrid').innerHTML = D.groups.map(g => `
  <div class="rgroup${g.k==='inputs'?' human':''}" id="g-${g.k}"${g.wide?' style="grid-column:1/3"':''}>
    <button class="glab" data-grp="${g.k}">${g.label}</button>
    <div class="rboxes" id="bx-${g.k}">${(g.boxes||[]).map(b =>
      `<button class="rbox${g.k==='inputs'?' hu':''}${b.big?' big':''}" id="rb-${b.k}" data-box="${b.k}">${b.label}</button>`
    ).join('')}</div>
  </div>`).join('');

let T = LOAD_AT, playing = false, speed = 1, lastFrame = 0, openCard = null, lastHtml = '';
const stage = $('stage'), fx = $('fx');
const BASE_RATE = 0.55;

/* ---------- geometry + tokens ---------- */
function center(id){
  let el = $(id); if (!el) return null;
  while (el && (el.offsetParent === null || !el.getBoundingClientRect().width)) el = el.parentElement;
  if (!el || el === document.body) return null;
  const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
  return {id, x: r.left - s.left + r.width/2, y: r.top - s.top + r.height/2};
}
const lerp=(a,b,p)=>a+(b-a)*p, ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function arcPos(A,B,p){
  const lift = Math.min(44, Math.hypot(B.x-A.x,B.y-A.y)*.17);
  return {x:lerp(A.x,B.x,p), y:lerp(A.y,B.y,p)-Math.sin(p*Math.PI)*lift};
}
const KIND = {write:{c:'var(--rx)',s:'pair'}, read:{c:'var(--rx)',s:'ring'},
  refused:{c:'var(--bad)',s:'pair'}, blind:{c:'var(--tx)',s:'sq'}, gold:{c:'var(--human)',s:'sq'}};
function tokSvg(kind){
  const kd = KIND[kind], ns='http://www.w3.org/2000/svg';
  const outer = document.createElementNS(ns,'g');
  for (let i=3;i>=1;i--){ const t=document.createElementNS(ns,'circle');
    t.setAttribute('r',3.4-i*0.5); t.setAttribute('fill',kd.c);
    t.setAttribute('opacity',0.2-i*0.04); t.setAttribute('class','trail'); outer.appendChild(t); }
  const g=document.createElementNS(ns,'g'); outer.appendChild(g); outer.head=g;
  const mk=(n,at)=>{const e=document.createElementNS(ns,n);for(const k in at)e.setAttribute(k,at[k]);g.appendChild(e);};
  if(kd.s==='pair'){mk('rect',{x:-8,y:-5,width:7,height:10,rx:2,fill:kd.c});
                    mk('rect',{x:1,y:-5,width:7,height:10,rx:2,fill:kd.c,opacity:.62});}
  else if(kd.s==='sq') mk('rect',{x:-5.5,y:-5.5,width:11,height:11,rx:2.5,fill:kd.c});
  else mk('circle',{r:5.5,fill:'none',stroke:kd.c,'stroke-width':2,'stroke-dasharray':'3 3'});
  return outer;
}
const liveToks = new Map();

/* ---------- reporting lines ---------- */
function drawWires(){
  const svg=$('wires'); if(!svg) return;
  const pr=svg.parentElement.getBoundingClientRect();
  svg.setAttribute('width',pr.width); svg.setAttribute('height',pr.height);
  svg.setAttribute('viewBox',`0 0 ${pr.width} ${pr.height}`);
  const R=id=>{const e=$(id); if(!e) return null; const r=e.getBoundingClientRect();
    return {l:r.left-pr.left,r:r.right-pr.left,t:r.top-pr.top,b:r.bottom-pr.top,
            cx:r.left-pr.left+r.width/2,cy:r.top-pr.top+r.height/2};};
  const live=id=>$(id)&&$(id).classList.contains('live');
  const out=[`<defs>
    <marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="var(--rx)"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="var(--ink-2)" opacity=".7"/></marker>
    <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.5 L9,5 L0,8.5 z" fill="var(--tx)"/></marker></defs>`];
  const P=(d,hot,head)=>out.push(`<path d="${d}" fill="none" stroke="${hot?'var(--rx)':'var(--line)'}" stroke-width="${hot?1.9:1.5}"${head?` marker-end="url(#${hot?'ahl':'ah'})"`:''} opacity="${hot?1:.8}" stroke-linecap="round" stroke-linejoin="round"/>`);
  const sp=R('ag-sponsor'), or=R('ag-orch'), au=R('ag-auditor');
  if(!sp||!or){svg.innerHTML=out.join(''); return;}
  P(`M${or.cx} ${or.t-3} V${sp.b+5}`, live('ag-orch'), true);
  const LEADS=[['ag-architect_docs_lead'],['ag-rtl_lead','ag-rtl_module_dev'],['ag-dv_lead','ag-tb_writer']];
  const cols=LEADS.map(([l])=>R(l));
  if(cols[0]){
    const busY=(or.b+cols[0].t)/2, anyLead=LEADS.some(([l])=>live(l));
    P(`M${cols[0].cx} ${busY} H${cols[cols.length-1].cx}`, anyLead, false);
    P(`M${or.cx} ${busY} V${or.b+3}`, anyLead, true);
    LEADS.forEach(([lid,...wids],i)=>{
      const L=cols[i]; if(!L) return;
      P(`M${L.cx} ${L.t-3} V${busY}`, live(lid), false);
      for(const w of wids){ if(!live(w)) continue; const W=R(w); if(!W) continue;
        P(`M${W.cx} ${W.t-3} V${L.b+4}`, true, true); }
    });
  }
  if(au && au.l-or.r>14)
    out.push(`<path d="M${au.l-5} ${au.cy} H${or.r+5}" fill="none" stroke="var(--tx)" stroke-width="${live('ag-auditor')?1.8:1.4}" stroke-dasharray="2 4" marker-end="url(#ahv)" opacity="${live('ag-auditor')?.95:.45}"/>`);
  svg.innerHTML=out.join('');
}

/* ---------- render ---------- */
function render(){
  let bi=0; for(let i=0;i<BEATS.length;i++) if(T>=BEATS[i].t) bi=i;
  const b=BEATS[bi], bp=Math.min(1,(T-b.t)/b.d);

  document.querySelectorAll('.agnode').forEach(el=>{
    if(el.id==='ag-sponsor') return;
    const seat=el.dataset.i;
    const on = b.agent===seat && bp>0.05 && bp<0.95;
    const ever = BEATS.some((x,i)=>i<=bi && x.agent===seat);
    el.classList.toggle('live', on);
    el.classList.toggle('ghost', !on);
    el.style.opacity = ever||on ? '' : '';
  });
  $('rempty').style.display = T < BEATS[0].d*0.5 ? 'flex' : 'none';

  for(const g of D.groups){
    const files=(INGROUP[g.k]||[]).filter(p=>T>=BORN[p].t);
    const el=$('g-'+g.k); if(el) el.classList.toggle('unborn', files.length===0);
    for(const bx of (g.boxes||[])){
      const e=$('rb-'+bx.k); if(!e) continue;
      const nf=files.filter(p=>(bx.match||[]).some(m=>p.startsWith(m))).length;
      // a box counts its files unless it declares something more meaningful to
      // count: one requirements FILE holds seventeen numbered requirements
      const n = nf && bx.nkey ? (D[bx.nkey]||[]).length : nf;
      e.classList.toggle('unborn', nf===0);
      let tag=e.querySelector('b.cnt');
      if(n){ if(!tag){tag=document.createElement('b');tag.className='cnt';e.appendChild(tag);} tag.textContent=' ×'+n; }
      else if(tag) tag.remove();
    }
  }

  document.querySelectorAll('.flashy').forEach(e=>e.classList.remove('flashy'));
  const want=new Set(); let gateHot=0, sweepP=-1;
  b.acts.forEach((a,ai)=>{
    const s=a.s??0, e=a.e??1;
    if(bp<s||bp>e) return;
    const p=(bp-s)/(e-s), key=bi+':'+ai;
    want.add(key);
    let tk=liveToks.get(key);
    if(!tk){tk=tokSvg(a.kind); fx.appendChild(tk); liveToks.set(key,tk);}
    const A=center(a.f), B=center(a.to);
    if(A&&B){
      const G=center('rp-gate');
      const pos = (a.kind==='refused'&&G) ? (p<.5?arcPos(A,G,ease(p*2)):arcPos(G,A,ease((p-.5)*2)))
                : (G&&a.f.startsWith('ag-')&&a.to.startsWith('g-')) ? (p<.45?arcPos(A,G,ease(p/.45)):arcPos(G,B,ease((p-.45)/.55)))
                : arcPos(A,B,ease(p));
      tk.setAttribute('visibility','visible');
      tk.head.setAttribute('transform',`translate(${pos.x},${pos.y})`);
      tk.querySelectorAll('.trail').forEach((el,i)=>{
        const q=arcPos(A,B,ease(Math.max(0,p-(i+1)*0.045)));
        el.setAttribute('transform',`translate(${q.x},${q.y})`);
      });
      tk.setAttribute('opacity', p<.08?p/.08 : p>.92?(1-p)/.08 : 1);
      if(a.kind==='refused'){ if(p>.35&&p<.65) gateHot=-1; }
      else if(p>.38&&p<.52) gateHot=gateHot||1;
      if(a.to.startsWith('g-')&&p>.8) $(a.to)?.classList.add('flashy');
    } else tk.setAttribute('visibility','hidden');
  });
  for(const [k,el] of liveToks) if(!want.has(k)){ el.remove(); liveToks.delete(k); }
  if(b.ci){ sweepP=bp; }
  const g=$('rp-gate');
  g.classList.toggle('hot',gateHot===1); g.classList.toggle('deny',gateHot===-1);
  const sw=$('sweep');
  if(sweepP>=0){ sw.style.opacity=1; sw.style.left=(sweepP*($('repo').getBoundingClientRect().width-56))+'px'; $('rci')?.classList.add('hot'); $('rp-ci').classList.add('hot'); }
  else { sw.style.opacity=0; $('rp-ci').classList.remove('hot'); }

  $('annoph').textContent=b.phase;
  $('annot').textContent=b.subject;
  $('annox').textContent=b.excerpt||'';
  $('beatct').textContent=(bi+1)+' / '+BEATS.length;
  $('annosha').innerHTML=`<a href="https://github.com/${D.repo}/commit/${b.sha}">${b.sha}</a> · ${b.agent.replace(/_/g,' ')} · ${b.entry}${b.wo&&b.wo!=='none'?' · '+b.wo:''}`;
  $('clock').textContent=Math.floor(T)+'s';
  $('scrub').value=T;
  drawWires();
  if(openCard) paintCard();
}

/* ---------- cards ---------- */
function filesIn(pred){ return Object.keys(BORN).filter(p=>T>=BORN[p].t&&pred(p)).sort(); }
function rows(list){ return list.map(r=>`<div class="lent"><div class="lhead"><span class="ln">${esc(r.n)}</span>${r.g?`<b class="pill${r.c||''}">${esc(r.g)}</b>`:''}</div>${r.d?`<div class="lde">${esc(r.d)}</div>`:''}</div>`).join(''); }
function holder(head,body,empty){ return `<div class="jbox"><div class="jhead">${head}</div>${body||`<div class="jempty">${empty}</div>`}</div>`; }

function paintCard(){
  const c=openCard; if(!c) return;
  let title='', h='', hint='live — scrub and watch it fill';
  const bi=BEATS.reduce((a,b,i)=>T>=b.t?i:a,0);

  if(c.k==='seat'){
    const seat=c.id, done=BEATS.filter((b,i)=>i<=bi&&b.agent===seat);
    title=SEATLABEL[seat]||seat;
    h=esc(D.seatdesc[seat]||'');
    if(seat==='tb_writer') h+=`<div class="lde" style="margin-top:.4rem"><b>This is the blind seat.</b> Its work order carried the specification and the numbered requirements and deliberately withheld <span class="mono">rtl/**</span>. It wrote ${D.total} checks from the specification alone; eight came back red against the design, and it did not adjust them.</div>`;
    h+=holder(done.length?`${done.length} commit${done.length>1?'s':''} · ${done.length} journal entr${done.length>1?'ies':'y'}`:'has not committed yet',
      rows(done.map(b=>({n:b.entry, d:b.subject}))),
      'This seat has committed nothing at this point in the project.');
  } else if(c.k==='grp'||c.k==='box'){
    const g=c.k==='grp' ? D.groups.find(x=>x.k===c.id)
                        : D.groups.find(x=>(x.boxes||[]).some(b=>b.k===c.id));
    const box=c.k==='box' ? g.boxes.find(b=>b.k===c.id) : null;
    title=box?box.label:g.label;
    h=esc((box?box.desc:g.desc)||'');
    const match = box ? box.match : (g.boxes||[]).flatMap(b=>b.match||[]);
    const fs=filesIn(p=>match.some(m=>p.startsWith(m)));
    if(box&&box.k==='reqs'){
      h+=holder(`${D.reqs.length} numbered requirements`,
        rows(D.reqs.map(r=>({n:r.id, g:r.method, c:' wait', d:r.title+' — '+r.text}))),'');
    } else if(box&&box.k==='benches'){
      h+=holder(`${D.benches.length} benches · ${D.total} checks`,
        rows(D.benches.map(b=>({n:b.name, g:`${b.pass}/${b.total}`, c:b.fail?' bad':'' })))+
        rows(fs.map(p=>({n:p}))), 'No bench exists at this point.');
    } else {
      h+=holder(fs.length?`${fs.length} file${fs.length>1?'s':''} so far`:'empty so far',
        rows(fs.map(p=>({n:p, d:D.src[p]?'click to read':''}))),
        'Nothing here at this point in the project.');
    }
  } else if(c.k==='file'){
    title=c.id; hint = T>=BORN[c.id].t ? 'committed at '+D.steps.find(s=>s.added.some(a=>a.p===c.id))?.sha : 'not yet committed';
    h = D.src[c.id] ? `<pre class="src">${esc(D.src[c.id].slice(0,16000))}</pre>` : '<div class="lde">Not embedded.</div>';
  } else { title=c.title||''; h=esc(c.body||''); hint=''; }

  $('dett').textContent=title;
  if(h!==lastHtml){ const jb=$('detx').querySelector('.jbox'); const sc=jb?jb.scrollTop:0;
    $('detx').innerHTML=h; lastHtml=h;
    const nb=$('detx').querySelector('.jbox'); if(nb) nb.scrollTop=sc; }
  $('dhint').textContent=hint;
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-i],[data-grp],[data-box],[data-file]');
  if(!el) return;
  if(el.dataset.grp) openCard={k:'grp',id:el.dataset.grp};
  else if(el.dataset.box) openCard={k:'box',id:el.dataset.box};
  else if(el.dataset.file) openCard={k:'file',id:el.dataset.file};
  else if(SEATS.includes(el.dataset.i)) openCard={k:'seat',id:el.dataset.i};
  else openCard={k:'static',title:D.statics[el.dataset.i]?.[0],body:D.statics[el.dataset.i]?.[1]};
  lastHtml=''; paintCard();
});

/* ---------- transport ---------- */
function frame(ts){
  if(playing){ const dt=Math.min(.1,(ts-lastFrame)/1000);
    T+=dt*speed*BASE_RATE*BEAT_D; if(T>=TOTAL){T=TOTAL; setPlay(false);} render(); }
  lastFrame=ts; requestAnimationFrame(frame);
}
function setPlay(p){ if(p&&T>=TOTAL-.1) T=0; playing=p;
  $('play').innerHTML=p?'&#10074;&#10074; PAUSE':'&#9654; PLAY'; }
$('play').addEventListener('click',()=>setPlay(!playing));
$('spd').addEventListener('click',()=>{ speed=speed===1?2:speed===2?4:speed===4?0.5:1;
  $('spd').textContent=(speed===0.5?'½':speed)+'×'; });
$('scrub').addEventListener('input',e=>{T=+e.target.value; render();});
$('scrub').max=TOTAL;

const phl=$('phlabels'), seen=new Set();
BEATS.forEach(b=>{ if(seen.has(b.phase)) return; seen.add(b.phase);
  const sp=document.createElement('span'); sp.textContent=b.phase;
  sp.style.left=(b.t/TOTAL*100)+'%'; if(seen.size%2===0) sp.style.top='.95rem';
  sp.addEventListener('click',()=>{setPlay(false); T=b.t; render();}); phl.appendChild(sp); });

$('sub').textContent=D.sub; $('foot').innerHTML=D.foot;
function sizeFx(){ const r=stage.getBoundingClientRect();
  fx.setAttribute('width',r.width); fx.setAttribute('height',r.height);
  fx.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`); }
addEventListener('resize',()=>{sizeFx(); render();});
sizeFx(); render(); requestAnimationFrame(frame);
</script>
</body></html>
